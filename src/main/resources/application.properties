spring.application.name=FrameSlot

server.port=${PORT:8080}

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:frameslot}?useSSL=${DB_SSL:false}&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Admin
frameslot.admin.name=${ADMIN_NAME:FrameSlot Admin}
frameslot.admin.email=${ADMIN_EMAIL:admin@frameslot.local}
frameslot.admin.password=${ADMIN_PASSWORD}

# JWT
frameslot.jwt.secret=${JWT_SECRET}
frameslot.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
